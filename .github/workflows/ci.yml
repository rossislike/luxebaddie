# Checks every change before it can reach main.
#
# The `main` branch ruleset (.github/rulesets/main.json) requires the
# "CI passed" job at the bottom, so a pull request cannot merge until every
# job here is green. None of these jobs need AWS or Stripe credentials.
name: CI

on:
  pull_request:
  # Also run on main so the result of each merge is visible and so pull
  # requests can reuse the dependency cache saved from main.
  push:
    branches: [main]

# A new push to a pull request makes the run for the previous push pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Matches the Lambda runtime in backend/lib/microservices.ts.
  NODE_VERSION: "24"

# Third-party actions are pinned to a commit, not a tag, so a hijacked tag
# cannot change what runs here. Dependabot keeps the pins current.
jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Report every failing check, not just the first one.
      fail-fast: false
      matrix:
        include:
          - name: Typecheck
            command: pnpm typecheck
          - name: Lint
            command: pnpm lint
          - name: Unit tests
            command: pnpm test
          # Bundles every Lambda and builds the CloudFormation template for
          # dev. It only builds: nothing is compared with or deployed to AWS.
          - name: CDK build
            command: pnpm --filter @luxebaddie/backend synth
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ${{ matrix.command }}

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a key that was added and later removed is still leaked.
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          rm "$archive"
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: Scan every commit for leaked keys
        run: gitleaks git --no-banner --redact .

  # The single check the main branch ruleset requires. Checks can be added,
  # renamed or removed above without touching the ruleset, as long as their
  # job is listed in `needs` here.
  ci-passed:
    name: CI passed
    if: always()
    needs: [check, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every check succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              exit 1
            fi
          done
